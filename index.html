<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gallery</title>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                 background: rgba(0,0,0,.6); color: white; cursor: pointer; font-size: 1.5rem; }
      #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; pointer-events: none; }
      #label { position: fixed; bottom: 2rem; width: 100%; text-align: center; color: white; font-size: 1.2rem;
               text-shadow: 0 0 4px black; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="overlay">Click to enter &middot; WASD to move</div>
    <div id="crosshair">+</div>
    <div id="label"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
